[project]
name = "notes2video"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7", "typer>=0.12", "pyyaml>=6", "openai>=1.40", "python-dotenv>=1",
  "numpy>=1.26", "soundfile>=0.12", "rapidfuzz>=3", "pymupdf>=1.24",
  "kokoro>=0.9.4", "faster-whisper>=1.0",
]

[project.scripts]
n2v = "notes2video.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["notes2video", "notes2video.tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
